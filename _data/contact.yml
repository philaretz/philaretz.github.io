# Email address, split into two fragments that are never concatenated
# in the page source — only in JavaScript at the visitor's browser, via
# _includes/bespoke/email-link.html. Neither fragment on its own reads
# as an address, and the two are only ever joined at runtime, so nothing
# resembling "name@domain" appears anywhere in the published HTML for a
# scraper to find. Keep this as the one place the address is spelled
# out; every page should go through that include rather than reference
# these fragments (or site.author.email) directly.
email_user: "aretz24"
email_domain: "mit.edu"
